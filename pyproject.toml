[project]
name = "seepwatch"
version = "0.1.0"
description = "Canal-loss forecasting engine validated on the SJRRP corridor"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "lightgbm>=4.3",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "pyarrow>=16",
  "duckdb>=1.0",
  "pydantic>=2.7",
  "python-dateutil>=2.9",
  "pyyaml>=6.0",
]

[project.scripts]
seepwatch-pipeline = "seepwatch.pipeline:main"
seepwatch-api = "seepwatch.api.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["seepwatch"]
